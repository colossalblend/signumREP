name: Build Android

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK (debug) + unit tests
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Релизный ключ в репозиторий не попадает: debug-сборка подписывается
      # отладочным ключом Gradle, этого достаточно для проверки компиляции.
      - name: Unit tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signum-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

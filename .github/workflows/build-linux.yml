name: Build Linux

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev usbmuxd libimobiledevice-utils ideviceinstaller

      - name: Install npm dependencies
        run: npm ci

      - name: chmod helper binaries
        run: |
          chmod +x linux_x64/ipatool linux_x64/ipatool-v4 linux_x64/ipatool-v5 linux_x64/zsign
          if [ -d linux_arm64 ]; then chmod +x linux_arm64/ipatool linux_arm64/ipatool-v4 linux_arm64/ipatool-v5 linux_arm64/zsign; fi

      - name: Build Linux bundles
        run: npm run tauri -- build --bundles deb --bundles appimage

      - name: Verify Linux bundles
        run: |
          test -n "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signum-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

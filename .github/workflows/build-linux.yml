name: Build Linux

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev usbmuxd libimobiledevice-utils ideviceinstaller

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch Linux tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tools-b42 -R "$GITHUB_REPOSITORY" -p signum-tools-linux-b42.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/signum-tools-linux-b42.tar.gz"

      - name: chmod helper binaries
        run: |
          find linux_x64 linux_arm64 -type f -exec chmod +x {} +

      - name: Build Linux deb package
        run: npm run build:linux-deb

      - name: Verify Linux deb package
        run: |
          test -n "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          dpkg-deb -f "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)" Version | grep -qx '1.2.4'

      - name: Build Linux AppImage
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run build:linux-appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signum-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

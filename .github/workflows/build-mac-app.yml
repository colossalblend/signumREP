name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install macOS dependencies
        run: |
          brew install libimobiledevice ideviceinstaller openssl@3 minizip

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare bundled device tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release download macos-tools-b39 -R "$GITHUB_REPOSITORY" -p apple-tools-macos-b39.tar.gz -D /tmp
          echo "2fbf9fdaead6c18609465dd8b9b5bada42f9efaf33dab2de722014d7b29f2e6f  /tmp/apple-tools-macos-b39.tar.gz" | shasum -a 256 -c
          mkdir -p apple-tools
          tar -C apple-tools -xzf /tmp/apple-tools-macos-b39.tar.gz
          find apple-tools -type f ! -name '*.dylib' ! -name '*.bin' ! -name '*.json' ! -name '*.txt' -exec chmod +x {} +
          for tool in idevice_id ideviceinfo ideviceinstaller idevicepair; do
            test "$(lipo -archs apple-tools/macos-x64/support/${tool})" = x86_64
            test "$(lipo -archs apple-tools/macos-arm64/support/${tool})" = arm64
            if otool -L apple-tools/macos-x64/support/${tool} apple-tools/macos-arm64/support/${tool} | grep -q /opt/homebrew; then
              echo "${tool} links Homebrew"; exit 1
            fi
          done
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          for arch in ['macos-arm64', 'macos-x64']:
              root = Path('apple-tools') / arch
              source = json.loads((root / 'SOURCE.json').read_text())
              for key, name in [('v5_sha256','v5/ipatool'),('idevice_id_sha256','support/idevice_id'),('ideviceinstaller_sha256','support/ideviceinstaller'),('libimobiledevice_sha256','support/libimobiledevice-1.0.6.dylib'),('libplist_sha256','support/libplist-2.0.12.dylib')]:
                  actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
                  assert actual == source[key], (arch, name, actual)
          PY

      - name: Check embedded login resources
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml macos_release_114 -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml ota_download_keeps_active_stream_and_rejects_stalled_or_corrupt_files -- --nocapture

      - name: Build macOS DMG
        run: |
          set -eux
          npm run build:mac-universal

      - name: Verify universal application
        run: |
          set -eux
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Signum.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = 1.2.0
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = 40
          lipo "$app/Contents/MacOS/signum" -verify_arch x86_64 arm64
          test -x "$app/Contents/Resources/resources/apple-tools/macos-arm64/v5/ipatool"
          test -x "$app/Contents/Resources/resources/apple-tools/macos-x64/v5/ipatool"
          codesign --verify --deep --strict "$app"

      - name: Verify and checksum DMG
        run: |
          set -eux
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)
          test -n "$dmg"
          shasum -a 256 "$dmg" | tee macos-sha256.txt

      - name: Save macOS release for deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release view macos-b40 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create macos-b40 --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Signum 1.2.0 build 40 macOS" \
            --notes "Universal Intel and Apple Silicon DMG; verified in CI." --draft
          gh release upload macos-b40 --clobber \
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            macos-sha256.txt

name: Build Windows

"on":
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (x64)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build tools
        run: python -m pip install --disable-pip-version-check pefile

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fill modules missing from the repository
        shell: bash
        run: |
          for m in pty_login system_proxy; do
            if [ ! -f "src-tauri/src/$m.rs" ]; then
              echo "::warning::src-tauri/src/$m.rs нет в репозитории — используется CI-заглушка"
              cp "src-tauri/ci-stubs/$m.rs" "src-tauri/src/$m.rs"
            fi
          done

      - name: Fetch Windows tools
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tools-b42 -R "$GITHUB_REPOSITORY" -p signum-tools-windows-b42.zip -D "$RUNNER_TEMP"
          unzip -o -q "$RUNNER_TEMP/signum-tools-windows-b42.zip"
          test -f apple-tools/windows-x64/v5/ipatool.exe

      - name: Install npm dependencies
        run: npm ci

      - name: Check frontend types
        run: npx tsc --noEmit

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify installer version and payload
        shell: bash
        run: |
          test -s installers/Signum_1.2.4_Setup.exe
          python - <<'PY'
          import zipfile
          z = zipfile.ZipFile('installer/payload/SignumPayload.zip')
          names = set(z.namelist())
          assert any(n.endswith('/signum.exe') or n == 'signum.exe' for n in names)
          assert any(n.endswith('/uninstall.exe') or n == 'uninstall.exe' for n in names)
          assert any(n.endswith('/resources/apple-tools/windows-x64/v5/ipatool.exe') for n in names)
          print('Windows installer payload:', len(names), 'files')
          PY

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: signum-windows-installer-1.2.4
          path: installers/Signum_1.2.4_Setup.exe
          if-no-files-found: error
          retention-days: 14

name: Build Windows

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "android/**"
      - "website/**"
      - "website-appbank/**"
      - "backend/**"
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "android/**"
      - "website/**"
      - "website-appbank/**"
      - "backend/**"
      - "**.md"

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Signum.exe (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fill modules missing from the repository
        shell: bash
        run: |
          for m in pty_login system_proxy; do
            if [ ! -f "src-tauri/src/$m.rs" ]; then
              echo "::warning::src-tauri/src/$m.rs нет в репозитории — используется CI-заглушка"
              cp "src-tauri/ci-stubs/$m.rs" "src-tauri/src/$m.rs"
            fi
          done

      - name: Fetch ipatool-cpp 1.3.2 (best effort)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl apple-tools/windows-x64/v5
          gh release download 1.3.2 -R Sorvigolova/ipatool -p '*indows*' -D dl
          for z in dl/*.zip; do [ -f "$z" ] && unzip -o -q "$z" -d dl/x; done
          exe="$(find dl -iname 'ipatool*.exe' | head -1)"
          test -n "$exe"
          cp "$exe" apple-tools/windows-x64/v5/ipatool.exe
          sha256sum apple-tools/windows-x64/v5/ipatool.exe

      - name: Install npm dependencies
        run: npm ci

      - name: Build Signum.exe
        run: npm run tauri -- build --no-bundle

      - name: Collect portable folder
        shell: bash
        run: |
          mkdir -p out/Signum/resources
          cp src-tauri/target/release/signum.exe out/Signum/Signum.exe
          cp -r apple-tools out/Signum/resources/apple-tools

      - name: Upload Signum.exe
        uses: actions/upload-artifact@v4
        with:
          name: signum-windows-x64
          path: out/Signum
          if-no-files-found: error

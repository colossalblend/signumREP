name: Tools inspect

"on":
  workflow_dispatch:
  push:
    branches:
      - claude/gifted-lamport-si8lz0
    paths:
      - .github/workflows/tools-discover.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect tools-b41
        env:
          GH_TOKEN: ${{ github.token }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -u
          for v in KS KSP KA KP; do
            if [ -n "${!v}" ]; then echo "secret $v: set"; else echo "secret $v: MISSING"; fi
          done
          echo "################ assets"
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name=="tools-b41") | .assets[] | "\(.name)  \(.size)  \(.digest // "-")"'
          mkdir -p /tmp/t && cd /tmp/t
          gh release download tools-b41 -R "$GITHUB_REPOSITORY" -D . || { echo "download failed"; exit 1; }
          for f in *; do
            echo "################ $f  $(sha256sum "$f" | cut -d' ' -f1)"
            case "$f" in
              *.zip) unzip -l "$f" | awk '{print $1, $4}' | sed '1,3d' ;;
              *.tar.gz|*.tgz) tar -tvzf "$f" | awk '{print $1, $3, $6}' ;;
              *.txt) cat "$f" ;;
            esac
          done

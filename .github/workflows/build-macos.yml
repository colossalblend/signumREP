name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install macOS dependencies
        run: |
          brew install libimobiledevice ideviceinstaller openssl@3 minizip

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch macOS tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release download tools-b42 -R "$GITHUB_REPOSITORY" -p signum-tools-macos-b42.tar.gz -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/signum-tools-macos-b42.tar.gz"
          find apple-tools -type f ! -name '*.dylib' ! -name '*.bin' ! -name '*.json' ! -name '*.txt' -exec chmod +x {} +
          for tool in idevice_id ideviceinfo ideviceinstaller idevicepair; do
            test "$(lipo -archs apple-tools/macos-x64/support/${tool})" = x86_64
            test "$(lipo -archs apple-tools/macos-arm64/support/${tool})" = arm64
            if otool -L apple-tools/macos-x64/support/${tool} apple-tools/macos-arm64/support/${tool} | grep -q /opt/homebrew; then
              echo "${tool} links Homebrew"; exit 1
            fi
          done
          # v4/v2 needs the SAP helper when the native C++ engine is
          # unavailable. Keep it in both architecture trees so Finder-launched
          # builds do not depend on Homebrew or PATH.
          for arch in arm64 x64; do
            test -f "apple-tools/macos-${arch}/v2/sapsigner"
            chmod +x "apple-tools/macos-${arch}/v2/sapsigner"
          done

      - name: Verify bundled Mac tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for arch in ("macos-arm64", "macos-x64"):
              root = Path("apple-tools") / arch
              for name in ('v5/ipatool', 'v5/kbsync', 'v5/libunicorn.2.dylib', 'v5/assets.bin',
                           'support/idevice_id', 'support/ideviceinstaller'):
                  assert (root / name).is_file(), (arch, name)
          PY

      - name: Build macOS DMG
        run: |
          set -eux
          npm run build:mac-universal

      - name: Verify universal application
        run: |
          set -eux
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Signum.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = 1.2.4
          lipo "$app/Contents/MacOS/signum" -verify_arch x86_64 arm64
          test -x "$app/Contents/Resources/resources/apple-tools/macos-arm64/v5/ipatool"
          test -x "$app/Contents/Resources/resources/apple-tools/macos-x64/v5/ipatool"
          codesign --verify --deep --strict "$app"

      - name: Verify and checksum DMG
        run: |
          set -eux
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f | head -1)
          test -n "$dmg"
          shasum -a 256 "$dmg" | tee macos-sha256.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: signum-macos-1.2.4
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            macos-sha256.txt

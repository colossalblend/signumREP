[package]
name = "signum-apple-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "native-tls", "gzip", "deflate", "brotli", "cookies"] }
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }

[profile.release]
strip = true


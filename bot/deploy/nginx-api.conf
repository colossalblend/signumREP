# В http {} nginx.conf. Замените домен и пути сертификата.
# У приложения: HTTP_HOST=127.0.0.1, API_TRUSTED_PROXIES=127.0.0.1/32
limit_req_zone $binary_remote_addr zone=signum_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=signum_logins:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=signum_connections:10m;

server {
    listen 443 ssl;
    server_name api.example.com;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn signum_connections 8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /api/v1/auth/jobs {
        limit_req zone=signum_logins burst=2 nodelay;
        limit_req zone=signum_requests burst=20 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
    location / {
        limit_req zone=signum_requests burst=20 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
}

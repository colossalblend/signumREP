[package]
name = "signum-setup"
version = "1.2.0"
description = "Signum installer"
authors = ["Signum"]
edition = "2021"
default-run = "signum-setup"

[[bin]]
name = "uninstall"
path = "src/bin/uninstall.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = false
codegen-units = 16
